# 화면 컨테이너: React 빌드 결과(dist/)만 내준다. /api는 앞단 nginx(nginx/nginx.conf)가 백엔드로 보내므로 여기까지 오지 않는다
server {
    listen 80;
    root /usr/share/nginx/html;

    # 화면 주소(/conversions/{id})로 바로 들어오거나 새로고침해도 index.html을 준다.
    # 어떤 화면을 그릴지는 React(route.ts)가 주소를 보고 정한다
    location / {
        try_files $uri /index.html;
    }

    # Vite가 만든 파일은 이름에 내용 해시가 붙어 있어 오래 캐시해도 된다 (내용이 바뀌면 이름이 바뀐다)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 캐시하지 않는다. 캐시되면 새로 배포해도 옛 assets 이름을 계속 찾는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
