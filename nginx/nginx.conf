# 앞단 nginx: 밖에서 들어오는 요청을 모두 받아 나눠 보낸다 (외부에 열린 포트는 이것 하나)
#   /api/  → backend  (Spring Boot, 8080)
#   그 밖  → frontend (React 정적 파일을 내주는 nginx, 80)
# 브라우저에는 주소가 하나로 보여 CORS 설정이 필요 없다
server {
    listen 80;

    # PDF 업로드 상한. Spring의 multipart 상한(application.yaml 20MB)과 맞춘다.
    # nginx 기본값은 1MB라 그대로 두면 큰 PDF가 413으로 막힌다
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HWPX 만들기(POST /render)가 긴 문서에서 몇 초 걸린다. PDF 읽기는 백그라운드라 여기에 걸리지 않는다
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
